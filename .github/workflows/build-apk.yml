name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'college-faq-chatbot/mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: college-faq-chatbot/mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: college-faq-chatbot/mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: college-faq-chatbot-apk
          path: college-faq-chatbot/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
